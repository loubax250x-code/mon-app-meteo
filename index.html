<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeoMétéo - Station Connectée</title>
    <style>
        :root {
            --bg-color: #121824;
            --card-bg: #1e293b;
            --accent: #3b82f6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            max-width: 600px;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }

        .search-container {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        input {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0f172a;
            color: white;
            font-size: 16px;
        }

        button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        /* Système d'onglets */
        .tabs {
            display: flex;
            width: 100%;
            max-width: 600px;
            background: #1e293b;
            border-radius: 8px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .tab-btn {
            flex: 1;
            padding: 15px;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            transition: 0.3s;
            border-radius: 0;
        }

        .tab-btn.active {
            background: var(--accent);
            color: white;
        }

        /* Contenu */
        .content-section {
            width: 100%;
            max-width: 600px;
            padding: 0 20px;
            box-sizing: border-box;
            display: none;
        }

        .content-section.active {
            display: block;
        }

        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .forecast-row, .archive-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #334155;
        }

        .forecast-row:last-child, .archive-row:last-child {
            border-bottom: none;
        }

        .loader {
            text-align: center;
            color: var(--accent);
            font-weight: bold;
            margin: 20px 0;
        }
    </style>
</head>
<body>

    <header>
        <h2 id="city-title">Ma Station Météo</h2>
        <div class="search-container">
            <input type="text" id="city-input" placeholder="Entrez une ville (ex: Paris)...">
            <button onclick="searchCity()">Rechercher</button>
        </div>
    </header>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('current')">Direct</button>
        <button class="tab-btn" onclick="switchTab('forecast')">7 Jours</button>
        <button class="tab-btn" onclick="switchTab('archives')">Archives</button>
    </div>

    <div id="loader" class="loader" style="display: none;">Chargement des données...</div>

    <div id="current" class="content-section active">
        <div class="card" style="text-align: center;">
            <h1 id="current-temp" style="font-size: 3rem; margin: 10px 0;">--°C</h1>
            <p id="current-wind">Vent : -- km/h</p>
            <p id="current-status">Statut : --</p>
        </div>
    </div>

    <div id="forecast" class="content-section">
        <div class="card" id="forecast-list">
            </div>
    </div>

    <div id="archives" class="content-section">
        <div class="card">
            <h3>Consulter une année passée</h3>
            <div class="search-container">
                <input type="number" id="archive-year" value="2023" min="1950" max="2025">
                <button onclick="loadArchives()">Analyser</button>
            </div>
            <div id="archive-results" style="margin-top: 15px;"></div>
        </div>

        <div class="card">
            <h3>🏆 Top 10 Records (Estimations)</h3>
            <div id="top10-list">
                <div class="archive-row"><span>🔥 Max Absolu</span> <strong>39.4 °C</strong></div>
                <div class="archive-row"><span>❄️ Min Absolu</span> <strong>-12.1 °C</strong></div>
                <div class="archive-row"><span>💨 Rafale max</span> <strong>104 km/h</strong></div>
                <div class="archive-row"><span>🌧️ Pluie max (24h)</span> <strong>45 mm</strong></div>
            </div>
        </div>
    </div>

    <script>
        // Coordonnées par défaut (Paris)
        let currentLat = 48.8566;
        let currentLon = 2.3522;

        // Code météo Open-Meteo vers texte en Français
        const weatherCodes = {
            0: "Ciel dégagé", 1: "Principalement dégagé", 2: "Partiellement nuageux", 3: "Couvert",
            45: "Brouillard", 51: "Bruine légère", 61: "Pluie légère", 63: "Pluie modérée",
            71: "Neige légère", 80: "Averses de pluie"
        };

        window.onload = function() {
            // Détection de la position de l'utilisateur au démarrage
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(position => {
                    currentLat = position.coords.latitude;
                    currentLon = position.coords.longitude;
                    document.getElementById('city-title').innerText = "📍 Ma Position";
                    fetchAllWeatherData();
                }, () => {
                    fetchAllWeatherData(); // Fallback si refusé
                });
            } else {
                fetchAllWeatherData();
            }
        };

        function switchTab(tabId) {
            document.querySelectorAll('.content-section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        async function searchCity() {
            const city = document.getElementById('city-input').value;
            if (!city) return;

            showLoader(true);
            try {
                const geoUrl = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=fr&format=json`;
                const res = await fetch(geoUrl);
                const data = await res.json();

                if (data.results && data.results.length > 0) {
                    const result = data.results[0];
                    currentLat = result.latitude;
                    currentLon = result.longitude;
                    document.getElementById('city-title').innerText = `🏙️ ${result.name} (${result.country})`;
                    await fetchAllWeatherData();
                } else {
                    alert("Ville introuvable.");
                }
            } catch (err) {
                console.error(err);
            } finally {
                showLoader(false);
            }
        }

        async function fetchAllWeatherData() {
            showLoader(true);
            try {
                // Fetch Temps réel + Prévisions 7 jours
                const url = `https://api.open-meteo.com/v1/forecast?latitude=${currentLat}&longitude=${currentLon}&current_weather=true&daily=temperature_2m_max,temperature_2m_min,weathercode&timezone=auto`;
                const res = await fetch(url);
                const data = await res.json();

                // 1. Update Direct
                const current = data.current_weather;
                document.getElementById('current-temp').innerText = `${current.temperature}°C`;
                document.getElementById('current-wind').innerText = `Vent : ${current.windspeed} km/h`;
                document.getElementById('current-status').innerText = `Statut : ${weatherCodes[current.weathercode] || "Inconnu"}`;

                // 2. Update Prévisions
                const forecastList = document.getElementById('forecast-list');
                forecastList.innerHTML = "";
                for (let i = 0; i < data.daily.time.length; i++) {
                    const date = new Date(data.daily.time[i]).toLocaleDateString('fr-FR', {weekday: 'long', day: 'numeric'});
                    const max = data.daily.temperature_2m_max[i];
                    const min = data.daily.temperature_2m_min[i];
                    const code = data.daily.weathercode[i];

                    forecastList.innerHTML += `
                        <div class="forecast-row">
                            <span><strong>${date}</strong><br><small>${weatherCodes[code] || "Variable"}</small></span>
                            <span>📈 ${max}°C / 📉 ${min}°C</span>
                        </div>
                    `;
                }
            } catch (err) {
                alert("Erreur lors de la récupération des données.");
            } finally {
                showLoader(false);
            }
        }

        async function loadArchives() {
            const year = document.getElementById('archive-year').value;
            const resContainer = document.getElementById('archive-results');
            resContainer.innerHTML = "<p>Calcul en cours sur les serveurs historiques...</p>";

            try {
                // API Archive Open-Meteo
                const archiveUrl = `https://archive-api.open-meteo.com/v1/archive?latitude=${currentLat}&longitude=${currentLon}&start_date=${year}-01-01&end_date=${year}-12-31&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,windspeed_10m_max&timezone=auto`;
                const res = await fetch(archiveUrl);
                const data = await res.json();

                if(data.daily) {
                    const maxTemps = data.daily.temperature_2m_max.filter(v => v !== null);
                    const minTemps = data.daily.temperature_2m_min.filter(v => v !== null);
                    const rain = data.daily.precipitation_sum.filter(v => v !== null);
                    
                    const absMax = Math.max(...maxTemps);
                    const absMin = Math.min(...minTemps);
                    const totalRain = rain.reduce((a, b) => a + b, 0).toFixed(1);

                    resContainer.innerHTML = `
                        <div class="archive-row"><span>🔥 Température Max (${year}) :</span> <strong>${absMax} °C</strong></div>
                        <div class="archive-row"><span>❄️ Température Min (${year}) :</span> <strong>${absMin} °C</strong></div>
                        <div class="archive-row"><span>🌧️ Cumul Pluie (${year}) :</span> <strong>${totalRain} mm</strong></div>
                    `;
                }
            } catch(e) {
                resContainer.innerHTML = "<p style='color:red;'>Données indisponibles pour cette zone ou année trop ancienne.</p>";
            }
        }

        function showLoader(show) {
            document.getElementById('loader').style.display = show ? 'block' : 'none';
        }
    </script>
</body>
</html>
